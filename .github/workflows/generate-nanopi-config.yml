name: Generate NanoPi R3S R6S Config

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: 'Select device model'
        required: true
        default: 'R3S'
        type: choice
        options:
        - R3S
        - R6S
      enable_features:
        description: 'Enable features'
        required: false
        type: string
        default: 'shortcut-fe,luci,firewall'

env:
  VERSION: SNAPSHOT
  KERNEL_VERSION: 6.1

jobs:
  generate-config:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout code
    - name: Checkout LEDE source
      uses: actions/checkout@v4

    # Step 2: Set environment variables
    - name: Setup environment
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        echo "DEVICE_MODEL=${{ github.event.inputs.device_model }}" >> $GITHUB_ENV
        
        if [ "${{ github.event.inputs.device_model }}" = "R3S" ]; then
          echo "TARGET_PLATFORM=rockchip" >> $GITHUB_ENV
          echo "TARGET_SUBPLATFORM=armv8" >> $GITHUB_ENV
          echo "DEVICE_PROFILE=friendlyarm_nanopi-r3s" >> $GITHUB_ENV
        else
          echo "TARGET_PLATFORM=rockchip" >> $GITHUB_ENV
          echo "TARGET_SUBPLATFORM=armv8" >> $GITHUB_ENV
          echo "DEVICE_PROFILE=friendlyarm_nanopi-r6s" >> $GITHUB_ENV
        fi

    # Step 3: Install build dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip rsync unzip zlib1g-dev file wget

    # Step 4: Add small-package feed and update
    - name: Add and update feeds
      run: |
        # 首先添加small-package feed到feeds.conf
        echo "src-git smpackage https://github.com/kenzok8/small-package" >> feeds.conf.default
        
        # 更新所有feeds
        ./scripts/feeds update -a
        
        # 安装所有基础包
        ./scripts/feeds install -a

    # Step 5: Apply base configuration
    - name: Setup base config
      run: |
        # Clear existing config
        > .config
        
        # Set target platform
        echo "Setting target platform: ${{ env.TARGET_PLATFORM }}"
        echo "CONFIG_TARGET_${{ env.TARGET_PLATFORM }}=y" >> .config
        echo "CONFIG_TARGET_${{ env.TARGET_PLATFORM }}_${{ env.TARGET_SUBPLATFORM }}=y" >> .config
        echo "CONFIG_TARGET_${{ env.TARGET_PLATFORM }}_${{ env.TARGET_SUBPLATFORM }}_DEVICE_${{ env.DEVICE_PROFILE }}=y" >> .config
        
        # Set kernel version
        echo "CONFIG_KERNEL_6_1=y" >> .config
        echo "CONFIG_DEFAULT_KERNEL_6_1=y" >> .config

    # Step 6: Enable ALL kernel modules
    - name: Enable all kernel modules
      run: |
        echo "Enabling CONFIG_ALL_KMODS for complete kernel module support..."
        echo "CONFIG_ALL_KMODS=y" >> .config
        echo "CONFIG_ALL_NONSHARED=y" >> .config
        echo "CONFIG_ALL=y" >> .config

    # Step 7: Apply device specific config
    - name: Apply device configuration
      run: |
        # Apply common nanopi config
        if [ -f configs/nanopi-common ]; then
          echo "Applying NanoPi common config..."
          cat configs/nanopi-common >> .config
        fi
        
        # Apply specific device config
        if [ -f configs/${{ github.event.inputs.device_model }}-specific ]; then
          echo "Applying ${{ github.event.inputs.device_model }} specific config..."
          cat configs/${{ github.event.inputs.device_model }}-specific >> .config
        fi

    # Step 8: Enable shortcut-fe acceleration
    - name: Configure network acceleration
      run: |
        echo "Enabling Shortcut-FE acceleration..."
        echo "CONFIG_PACKAGE_kmod-shortcut-fe=y" >> .config
        echo "CONFIG_PACKAGE_kmod-shortcut-fe-cm=y" >> .config
        echo "CONFIG_PACKAGE_shortcut-fe=y" >> .config
        
        # Firewall configuration (fw4)
        echo "CONFIG_PACKAGE_firewall4=y" >> .config
        echo "CONFIG_PACKAGE_fw4=y" >> .config
        echo "CONFIG_PACKAGE_iptables-nft=y" >> .config

    # Step 9: Configure package management and quickstart
    - name: Configure package manager
      run: |
        # Package manager config
        echo "CONFIG_PACKAGE_apk=y" >> .config
        
        # Base system packages
        echo "CONFIG_PACKAGE_base-files=y" >> .config
        echo "CONFIG_PACKAGE_busybox=y" >> .config
        echo "CONFIG_PACKAGE_dropbear=y" >> .config
        
        # Network tools
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_iwinfo=y" >> .config
        
        # Quickstart packages from small-package
        echo "CONFIG_PACKAGE_quickstart=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y" >> .config

    # Step 10: Verify quickstart packages are available
    - name: Verify package availability
      run: |
        echo "Checking available packages..."
        ./scripts/feeds list | grep quickstart || echo "Quickstart packages not found in feeds"
        
        echo "Checking package directories..."
        find feeds -name "*quickstart*" -type d 2>/dev/null | head -10 || echo "No quickstart packages found in feeds directory"

    # Step 11: Generate final config
    - name: Generate final configuration
      run: |
        # Run defconfig to resolve dependencies
        make defconfig
        
        echo "=== Configuration Generated ==="
        echo "Device: NanoPi ${{ github.event.inputs.device_model }}"
        echo "Version: ${{ env.VERSION }}"
        echo "Kernel: ${{ env.KERNEL_VERSION }}"
        echo "Firewall: fw4"
        echo "Acceleration: shortcut-fe"
        echo "Package Manager: apk"
        echo "Quickstart: Enabled"
        echo "Kernel Modules: CONFIG_ALL_KMODS enabled"

    # Step 12: Save and upload config files
    - name: Save configuration files
      run: |
        # Create output directory
        mkdir -p artifacts
        
        # Save config files
        cp .config artifacts/nanopi-${{ github.event.inputs.device_model }}-config
        cp .config artifacts/config-${{ env.BUILD_DATE }}
        
        # Generate config report
        echo "NanoPi ${{ github.event.inputs.device_model }} Build Configuration" > artifacts/config-report.txt
        echo "Build Time: ${{ env.BUILD_DATE }}" >> artifacts/config-report.txt
        echo "Version: ${{ env.VERSION }}" >> artifacts/config-report.txt
        echo "Kernel: ${{ env.KERNEL_VERSION }}" >> artifacts/config-report.txt
        echo "Enabled Features: shortcut-fe, fw4, apk, quickstart" >> artifacts/config-report.txt
        echo "Kernel Modules: CONFIG_ALL_KMODS=y" >> artifacts/config-report.txt
        
        # Check quickstart package status
        echo "Quickstart Package Status:" >> artifacts/config-report.txt
        grep "CONFIG_PACKAGE.*quickstart" .config >> artifacts/config-report.txt || echo "Not found" >> artifacts/config-report.txt

    - name: Upload configuration artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nanopi-${{ github.event.inputs.device_model }}-config
        path: artifacts/
        retention-days: 30

    # Step 13: Completion notice
    - name: Display results
      run: |
        echo "✅ NanoPi ${{ github.event.inputs.device_model }} configuration generated successfully!"
        echo "📁 Files saved as artifact: nanopi-${{ github.event.inputs.device_model }}-config"
        echo "🔧 CONFIG_ALL_KMODS has been enabled for full kernel module support"
        echo "🚀 Quickstart package configured from small-package feed"
