name: 生成LEDE配置文件

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main, master ]
    paths: [ 'config/**', '.github/workflows/generate-config.yml' ]

env:
  TARGET: x86
  SUBTARGET: 64
  PROFILE: generic

jobs:
  generate-config:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置环境变量
      run: |
        echo "REPO_URL=${{ github.repository }}" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip rsync unzip zlib1g-dev file wget

    - name: 更新Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用基础配置
      run: |
        # 设置目标平台
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
        
        # 基础包配置
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-ssl=y" >> .config

    - name: 合并自定义配置
      run: |
        if [ -f config/custom_config ]; then
          echo "找到自定义配置，正在合并..."
          cat config/custom_config >> .config
        fi
        
        if [ -d config/partials ]; then
          echo "找到部分配置片段，正在合并..."
          cat config/partials/* >> .config 2>/dev/null || true
        fi

    - name: 生成最终配置
      run: |
        make defconfig
        echo "配置文件生成完成！"

    - name: 保存配置文件
      run: |
        mkdir -p artifacts
        cp .config artifacts/
        cp .config artifacts/config-${{ env.BUILD_DATE }}
        
        # 生成配置摘要
        grep "^CONFIG_" .config | head -20 > artifacts/config-summary.txt

    - name: 上传配置文件
      uses: actions/upload-artifact@v4
      with:
        name: lede-config-files
        path: |
          artifacts/.config
          artifacts/config-*
          artifacts/config-summary.txt
        retention-days: 30

    - name: 显示配置摘要
      run: |
        echo "=== 生成的配置摘要 ==="
        cat artifacts/config-summary.txt
        echo "======================"
