name: Build NanoPi R3S R6S Firmware

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: 'Select device model'
        required: true
        default: 'R3S'
        type: choice
        options:
        - R3S
        - R6S
      enable_features:
        description: 'Enable features'
        required: false
        type: string
        default: 'turboacc,quickstart,firewall'
      clean_cache:
        description: 'Clean build cache (use if having build issues)'
        required: false
        type: boolean
        default: false

env:
  VERSION: SNAPSHOT
  KERNEL_VERSION: 6.12

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    # Step 1: Checkout code
    - name: Checkout LEDE source
      uses: actions/checkout@v4

    # Step 2: Set environment variables
    - name: Setup environment
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        echo "DEVICE_MODEL=${{ github.event.inputs.device_model }}" >> $GITHUB_ENV
        
        if [ "${{ github.event.inputs.device_model }}" = "R3S" ]; then
          echo "TARGET_PLATFORM=rockchip" >> $GITHUB_ENV
          echo "TARGET_SUBPLATFORM=armv8" >> $GITHUB_ENV
          echo "DEVICE_PROFILE=friendlyarm_nanopi-r3s" >> $GITHUB_ENV
        else
          echo "TARGET_PLATFORM=rockchip" >> $GITHUB_ENV
          echo "TARGET_SUBPLATFORM=armv8" >> $GITHUB_ENV
          echo "DEVICE_PROFILE=friendlyarm_nanopi-r6s" >> $GITHUB_ENV
        fi

    # Step 3: Install build dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip rsync unzip zlib1g-dev file wget

    # Step 4: Setup build cache
    - name: Setup build cache
      uses: actions/cache@v4
      with:
        path: |
          dl
          staging_dir
          build_dir
          tmp
        key: ${{ runner.os }}-lede-${{ env.TARGET_PLATFORM }}-${{ env.TARGET_SUBPLATFORM }}-${{ hashFiles('feeds.conf.default', '.config', 'package/**', 'target/**') }}
        restore-keys: |
          ${{ runner.os }}-lede-${{ env.TARGET_PLATFORM }}-${{ env.TARGET_SUBPLATFORM }}-
          ${{ runner.os }}-lede-

    # Step 5: Clean cache if requested
    - name: Clean cache if requested
      if: ${{ github.event.inputs.clean_cache == 'true' }}
      run: |
        echo "Cleaning build cache as requested..."
        rm -rf dl/* staging_dir/* build_dir/* tmp/*
        echo "Build cache cleaned"

    # Step 6: Setup feeds and install specific packages
    - name: Setup feeds and packages
      run: |
        # 清理重复的smpackage配置
        if grep -q "smpackage" feeds.conf.default; then
          echo "Cleaning existing smpackage entries..."
          grep -v "smpackage" feeds.conf.default > feeds.conf.default.tmp
          mv feeds.conf.default.tmp feeds.conf.default
        fi
        
        # 添加标准的smpackage feed
        echo "src-git smpackage https://github.com/kenzok8/small-package" >> feeds.conf.default
        
        echo "Final feeds.conf.default:"
        cat feeds.conf.default
        
        # 更新所有feeds
        ./scripts/feeds update -a
        
        # 安装基础包
        ./scripts/feeds install -a
        
        # 特别安装quickstart相关包
        ./scripts/feeds install -p smpackage luci-app-quickstart
        ./scripts/feeds install -p smpackage quickstart

    # Step 7: Apply base configuration
    - name: Setup base config
      run: |
        # Clear existing config
        > .config
        
        # Set target platform
        echo "Setting target platform: ${{ env.TARGET_PLATFORM }}"
        echo "CONFIG_TARGET_${{ env.TARGET_PLATFORM }}=y" >> .config
        echo "CONFIG_TARGET_${{ env.TARGET_PLATFORM }}_${{ env.TARGET_SUBPLATFORM }}=y" >> .config
        echo "CONFIG_TARGET_${{ env.TARGET_PLATFORM }}_${{ env.TARGET_SUBPLATFORM }}_DEVICE_${{ env.DEVICE_PROFILE }}=y" >> .config
        
        # Set kernel version to 6.12
        echo "CONFIG_KERNEL_6_12=y" >> .config
        echo "CONFIG_DEFAULT_KERNEL_6_12=y" >> .config
        echo "# CONFIG_KERNEL_6_1 is not set" >> .config
        echo "# CONFIG_DEFAULT_KERNEL_6_1 is not set" >> .config

    # Step 8: Enable specific kernel modules for required features
    - name: Enable specific kernel modules
      run: |
        echo "Enabling specific kernel modules for required features..."
        
        # 禁用全 KMODS，改为模块化编译
        echo "# CONFIG_ALL_KMODS is not set" >> .config
        echo "# CONFIG_ALL_NONSHARED is not set" >> .config
        
        # 网络加速相关模块
        echo "CONFIG_PACKAGE_kmod-shortcut-fe=m" >> .config
        echo "CONFIG_PACKAGE_kmod-shortcut-fe-cm=m" >> .config
        echo "CONFIG_PACKAGE_kmod-fast-classifier=m" >> .config
        echo "CONFIG_PACKAGE_kmod-tcp-bbr=m" >> .config
        
        # Fullcone NAT 支持
        echo "CONFIG_PACKAGE_kmod-nft-fullcone=m" >> .config
        echo "CONFIG_PACKAGE_kmod-ipt-fullcone=m" >> .config
        
        # Docker 容器支持
        echo "CONFIG_PACKAGE_kmod-veth=m" >> .config
        echo "CONFIG_PACKAGE_kmod-br-netfilter=m" >> .config
        echo "CONFIG_PACKAGE_kmod-ikconfig=m" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-nat=m" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-conntrack=m" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-conntrack-netlink=m" >> .config
        
        # 文件系统支持 (Docker 和 AList 需要)
        echo "CONFIG_PACKAGE_kmod-fs-overlay=m" >> .config
        echo "CONFIG_PACKAGE_kmod-fuse=m" >> .config
        echo "CONFIG_PACKAGE_kmod-fs-ext4=m" >> .config
        echo "CONFIG_PACKAGE_kmod-fs-vfat=m" >> .config
        echo "CONFIG_PACKAGE_kmod-fs-ntfs=m" >> .config
        
        # ZRAM 压缩内存
        echo "CONFIG_PACKAGE_kmod-zram=m" >> .config
        
        # USB 存储支持 (AList 需要)
        echo "CONFIG_PACKAGE_kmod-usb-storage=m" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-storage-uas=m" >> .config
        echo "CONFIG_PACKAGE_kmod-scsi-core=m" >> .config
        
        # 网络协议支持
        echo "CONFIG_PACKAGE_kmod-ipv6=m" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-iptables=m" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-conntrack=m" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-tproxy=m" >> .config
        
        # 加密支持
        echo "CONFIG_PACKAGE_kmod-crypto-acompress=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-cbc=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-ccm=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-cmac=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-crc32c=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-ctr=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-ghash=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-gcm=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-hash=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-hmac=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-rng=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-seqiv=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-sha256=m" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-sha512=m" >> .config
        
        echo "Specific kernel modules enabled as modules"

    # Step 9: Apply device specific config
    - name: Apply device configuration
      run: |
        # Apply common nanopi config
        if [ -f configs/nanopi-common ]; then
          echo "Applying NanoPi common config..."
          cat configs/nanopi-common >> .config
        fi
        
        # Apply specific device config
        if [ -f configs/${{ github.event.inputs.device_model }}-specific ]; then
          echo "Applying ${{ github.event.inputs.device_model }} specific config..."
          cat configs/${{ github.event.inputs.device_model }}-specific >> .config
        fi

    # Step 10: Enable required applications
    - name: Configure applications
      run: |
        echo "Enabling required applications..."
        
        # APK 软件包管理器
        echo "CONFIG_PACKAGE_apk=y" >> .config
        
        # TurboACC 加速
        echo "CONFIG_PACKAGE_luci-app-turboacc=m" >> .config
        echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_FLOW_OFFLOADING=y" >> .config
        echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_BBR_CCA=y" >> .config
        
        # 代理软件 (singbox / clash-like)
        echo "CONFIG_PACKAGE_singbox=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-ssr-plus=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config
        
        # DNS 服务
        echo "CONFIG_PACKAGE_smartdns=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-smartdns=m" >> .config
        echo "CONFIG_PACKAGE_mosdns=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
        
        # Docker 容器
        echo "CONFIG_PACKAGE_docker=m" >> .config
        echo "CONFIG_PACKAGE_dockerd=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-docker=m" >> .config
        
        # ZRAM 压缩内存
        echo "CONFIG_PACKAGE_zram-swap=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-zram=m" >> .config
        
        # AList 文件列表
        echo "CONFIG_PACKAGE_alist=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-alist=m" >> .config
        
        # Fullcone NAT
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        echo "CONFIG_PACKAGE_firewall4=y" >> .config
        echo "CONFIG_PACKAGE_iptables-nft=y" >> .config
        echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config
        
        # Quickstart
        echo "CONFIG_PACKAGE_quickstart=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config

    # Step 11: Configure base system packages
    - name: Configure base packages
      run: |
        echo "Configuring base system packages..."
        
        # 基础系统
        echo "CONFIG_PACKAGE_base-files=y" >> .config
        echo "CONFIG_PACKAGE_busybox=y" >> .config
        echo "CONFIG_PACKAGE_dropbear=y" >> .config
        echo "CONFIG_PACKAGE_opkg=y" >> .config
        
        # 网络工具
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_iwinfo=y" >> .config
        echo "CONFIG_PACKAGE_iptables=y" >> .config
        
        # Luci 界面
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        # 工具
        echo "CONFIG_PACKAGE_wget-ssl=y" >> .config
        echo "CONFIG_PACKAGE_curl=y" >> .config
        
        # 禁用不必要的包
        echo "# CONFIG_PACKAGE_valgrind is not set" >> .config
        echo "# CONFIG_PACKAGE_gdb is not set" >> .config
        echo "# CONFIG_PACKAGE_strace is not set" >> .config
        echo "# CONFIG_PACKAGE_ltrace is not set" >> .config
        echo "# CONFIG_PACKAGE_perl is not set" >> .config
        echo "# CONFIG_PACKAGE_python3 is not set" >> .config

    # Step 12: Verify package availability
    - name: Verify package availability
      run: |
        echo "=== Checking package availability ==="
        echo "Available quickstart packages:"
        ./scripts/feeds list | grep -i quickstart || echo "No quickstart packages found in feeds list"
        
        echo "Available proxy packages:"
        ./scripts/feeds list | grep -i -E "singbox|passwall|ssr" || echo "No proxy packages found in feeds list"
        
        echo "Available APK packages:"
        ./scripts/feeds list | grep -i apk || echo "No APK packages found in feeds list"

    # Step 13: Generate final config and resolve dependencies
    - name: Generate final configuration
      run: |
        # Run defconfig to resolve dependencies
        make defconfig
        
        echo "=== Configuration Generated ==="
        echo "Device: NanoPi ${{ github.event.inputs.device_model }}"
        echo "Version: ${{ env.VERSION }}"
        echo "Kernel: ${{ env.KERNEL_VERSION }}"
        echo "Package Manager: APK"
        echo "Enabled Features:"
        echo "  - Singbox / Clash-like proxy"
        echo "  - Shortcut-FE acceleration"
        echo "  - TurboACC with fullcone NAT"
        echo "  - Docker container support"
        echo "  - Fast classifier"
        echo "  - SmartDNS & MosDNS"
        echo "  - ZRAM compression"
        echo "  - AList file manager"
        echo "  - Quickstart"

    # Step 14: Start firmware compilation
    - name: Compile firmware
      run: |
        echo "Starting firmware compilation for NanoPi ${{ github.event.inputs.device_model }}..."
        echo "This may take a long time (60-180 minutes)..."
        
        # 检查缓存状态
        echo "Build cache status:"
        du -sh dl staging_dir build_dir tmp 2>/dev/null || echo "Cache directories not present"
        
        # 开始编译 - 使用多线程加速
        make -j$(nproc) V=s
        
        echo "Firmware compilation completed!"

    # Step 15: Collect build artifacts
    - name: Collect firmware artifacts
      run: |
        echo "Collecting firmware artifacts..."
        
        # 创建输出目录
        mkdir -p firmware-artifacts
        
        # 复制固件文件
        if [ -d bin/targets/${{ env.TARGET_PLATFORM }}/${{ env.TARGET_SUBPLATFORM }} ]; then
          cp -r bin/targets/${{ env.TARGET_PLATFORM }}/${{ env.TARGET_SUBPLATFORM }}/* firmware-artifacts/
        fi
        
        # 复制镜像文件
        if [ -d bin/targets ]; then
          find bin/targets -name "*.img" -o -name "*.bin" -o -name "*.gz" | xargs -I {} cp {} firmware-artifacts/ || true
        fi
        
        # 生成构建报告
        echo "NanoPi ${{ github.event.inputs.device_model }} Firmware Build Report" > firmware-artifacts/build-report.txt
        echo "Build Time: ${{ env.BUILD_DATE }}" >> firmware-artifacts/build-report.txt
        echo "Version: ${{ env.VERSION }}" >> firmware-artifacts/build-report.txt
        echo "Kernel: ${{ env.KERNEL_VERSION }}" >> firmware-artifacts/build-report.txt
        echo "Package Manager: APK" >> firmware-artifacts/build-report.txt
        echo "Target: ${{ env.TARGET_PLATFORM }}/${{ env.TARGET_SUBPLATFORM }}" >> firmware-artifacts/build-report.txt
        echo "Device: ${{ env.DEVICE_PROFILE }}" >> firmware-artifacts/build-report.txt
        echo "Features: Singbox, TurboACC, Docker, SmartDNS, ZRAM, AList" >> firmware-artifacts/build-report.txt
        echo "Kernel Modules: Specific modules only (not ALL_KMODS)" >> firmware-artifacts/build-report.txt
        echo "Cache Used: ${{ github.event.inputs.clean_cache == 'true' && 'No (cleaned)' || 'Yes' }}" >> firmware-artifacts/build-report.txt
        echo "Status: COMPLETED" >> firmware-artifacts/build-report.txt
        
        # 显示生成的文件
        echo "Generated files:" >> firmware-artifacts/build-report.txt
        ls -la firmware-artifacts/ >> firmware-artifacts/build-report.txt

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nanopi-${{ github.event.inputs.device_model }}-firmware
        path: firmware-artifacts/
        retention-days: 30

    # Step 16: Completion notice
    - name: Display build results
      run: |
        echo "✅ NanoPi ${{ github.event.inputs.device_model }} firmware build completed successfully!"
        echo "📁 Firmware saved as artifact: nanopi-${{ github.event.inputs.device_model }}-firmware"
        echo "🔧 Specific kernel modules enabled (not ALL_KMODS)"
        echo "🐧 Kernel Version: ${{ env.KERNEL_VERSION }}"
        echo "📦 Package Manager: APK"
        echo "🚀 Enabled features: Singbox, TurboACC, Docker, SmartDNS, ZRAM, AList"
        echo "💾 Build cache: ${{ github.event.inputs.clean_cache == 'true' && 'Cleaned (fresh build)' || 'Used (cached build)' }}"
        echo "⏰ Build time: ${{ env.BUILD_DATE }}"
