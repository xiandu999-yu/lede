name: 生成NanoPi R3S+R6S配置文件

on:
  workflow_dispatch:  # 手动触发
    inputs:
      设备型号:
        description: '选择设备型号'
        required: true
        default: 'R3S'
        type: choice
        options:
        - R3S
        - R6S
      启用功能:
        description: '选择启用功能'
        required: false
        type: string
        default: 'shortcut-fe,luci,firewall'

env:
  版本: SNAPSHOT
  内核版本: 6.1

jobs:
  生成配置:
    runs-on: ubuntu-latest
    
    steps:
    # 步骤1：准备环境
    - name: ① 检出LEDE源码
      uses: actions/checkout@v4

    - name: ② 设置构建环境变量
      run: |
        echo "构建日期=$(date +%Y年%m月%d日-%H时%M分)" >> $GITHUB_ENV
        echo "设备型号=${{ github.event.inputs.设备型号 }}" >> $GITHUB_ENV
        
        # 根据设备型号设置目标配置
        if [ "${{ github.event.inputs.设备型号 }}" = "R3S" ]; then
          echo "目标平台=rockchip" >> $GITHUB_ENV
          echo "目标子平台=armv8" >> $GITHUB_ENV
          echo "设备配置文件=friendlyarm_nanopi-r3s" >> $GITHUB_ENV
        else
          echo "目标平台=rockchip" >> $GITHUB_ENV
          echo "目标子平台=armv8" >> $GITHUB_ENV
          echo "设备配置文件=friendlyarm_nanopi-r6s" >> $GITHUB_ENV
        fi

    # 步骤2：安装必要的软件包
    - name: ③ 安装编译依赖包
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          构建工具 clang flex bison g++ gawk \
          多架构gcc支持 获取文本 git库 \
          ncurses开发库 ssl开发库 python3 \
          python3-pip rsync解压 zip解压 zlib开发库 \
          文件工具 wget下载

    # 步骤3：软件源和包管理设置
    - name: ④ 更新软件源和安装包
      run: |
        # 更新feeds（软件源）
        ./scripts/feeds update -a
        # 安装所有可用的包
        ./scripts/feeds install -a

    # 步骤4：应用基础设备配置
    - name: ⑤ 设置设备基础配置
      run: |
        # 清空现有配置
        > .config
        
        # 设置目标平台（Rockchip）
        echo "设置目标平台：${{ env.目标平台 }}"
        echo "CONFIG_TARGET_${{ env.目标平台 }}=y" >> .config
        echo "CONFIG_TARGET_${{ env.目标平台 }}_${{ env.目标子平台 }}=y" >> .config
        echo "CONFIG_TARGET_${{ env.目标平台 }}_${{ env.目标子平台 }}_DEVICE_${{ env.设备配置文件 }}=y" >> .config
        
        # 设置内核版本
        echo "CONFIG_KERNEL_6_1=y" >> .config
        echo "CONFIG_DEFAULT_KERNEL_6_1=y" >> .config

    # 步骤5：应用NanoPi专用配置
    - name: ⑥ 应用NanoPi设备专用配置
      run: |
        # 应用设备通用配置
        if [ -f 设备配置/nanopi-通用配置 ]; then
          echo "应用NanoPi通用配置..."
          cat 设备配置/nanopi-通用配置 >> .config
        fi
        
        # 应用具体设备配置
        if [ -f 设备配置/${{ github.event.inputs.设备型号 }}-专用配置 ]; then
          echo "应用${{ github.event.inputs.设备型号 }}专用配置..."
          cat 设备配置/${{ github.event.inputs.设备型号 }}-专用配置 >> .config
        fi

    # 步骤6：启用shortcut-fe加速
    - name: ⑦ 配置网络加速功能
      run: |
        echo "启用Shortcut-FE加速..."
        echo "CONFIG_PACKAGE_kmod-shortcut-fe=y" >> .config
        echo "CONFIG_PACKAGE_kmod-shortcut-fe-cm=y" >> .config
        echo "CONFIG_PACKAGE_shortcut-fe=y" >> .config
        
        # 防火墙配置（fw4）
        echo "CONFIG_PACKAGE_firewall4=y" >> .config
        echo "CONFIG_PACKAGE_fw4=y" >> .config
        echo "CONFIG_PACKAGE_iptables-nft=y" >> .config

    # 步骤7：应用软件包配置
    - name: ⑧ 配置软件包管理
      run: |
        # 包管理器配置
        echo "CONFIG_PACKAGE_apk=y" >> .config
        
        # 基础系统包
        echo "CONFIG_PACKAGE_base-files=y" >> .config
        echo "CONFIG_PACKAGE_busybox=y" >> .config
        echo "CONFIG_PACKAGE_dropbear=y" >> .config
        
        # 网络工具
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_iwinfo=y" >> .config

    # 步骤8：生成最终配置
    - name: ⑨ 生成最终配置文件
      run: |
        # 运行defconfig来解决依赖关系
        make defconfig
        
        # 显示配置摘要
        echo "=== 配置生成完成 ==="
        echo "设备：NanoPi ${{ github.event.inputs.设备型号 }}"
        echo "版本：${{ env.版本 }}"
        echo "内核：${{ env.内核版本 }}"
        echo "防火墙：fw4"
        echo "加速：shortcut-fe"
        echo "包管理：apk"

    # 步骤9：保存和上传配置文件
    - name: ⑩ 保存配置文件
      run: |
        # 创建输出目录
        mkdir -p 生成结果
        
        # 保存配置文件
        cp .config 生成结果/NanoPi-${{ github.event.inputs.设备型号 }}-配置文件
        cp .config 生成结果/config-${{ env.构建日期 }}
        
        # 生成配置报告
        echo "NanoPi ${{ github.event.inputs.设备型号 }} 构建配置" > 生成结果/配置报告.txt
        echo "生成时间：${{ env.构建日期 }}" >> 生成结果/配置报告.txt
        echo "版本：${{ env.版本 }}" >> 生成结果/配置报告.txt
        echo "内核：${{ env.内核版本 }}" >> 生成结果/配置报告.txt
        echo "启用功能：shortcut-fe, fw4, apk" >> 生成结果/配置报告.txt

    - name: ⑪ 上传配置文件
      uses: actions/upload-artifact@v4
      with:
        name: NanoPi-${{ github.event.inputs.设备型号 }}-配置文件
        path: |
          生成结果/
        retention-days: 30

    # 步骤10：完成通知
    - name: ⑫ 显示生成结果
      run: |
        echo "🎉 NanoPi ${{ github.event.inputs.设备型号 }} 配置文件生成成功！"
        echo "📁 文件已保存为 Artifact：NanoPi-${{ github.event.inputs.设备型号 }}-配置文件"
        echo "⏰ 生成时间：${{ env.构建日期 }}"
